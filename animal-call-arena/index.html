<title>动物模仿大赛 · Animal Voice Arena</title>
<meta name="description" content="听动物的真实野外录音，对着麦克风模仿它，系统从音准、节奏、走向、稳定度四个维度打分。零依赖、零后端的纯静态网页应用。" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#EBF1E7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0A1512" media="(prefers-color-scheme: dark)" />

<!-- 主题必须在首屏绘制前定下来，否则会闪一下浅色再变深色 -->
<script>
(function () {
  var t = 'light';
  try {
    var raw = localStorage.getItem('ava.v2');
    var saved = raw ? JSON.parse(raw).theme : null;
    if (saved === 'dark' || saved === 'light') t = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
  } catch (e) { /* 存储不可用就跟随系统 */ }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
